<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MoeKoe-Music-SearchTips 调试台</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 16px; background: #1e1e1e; color: #ddd; }
    h1 { font-size: 18px; margin: 0 0 12px; color: #1db954; }
    .layout { display: flex; gap: 16px; }
    .left { flex: 1.2; }
    .right { flex: 1; min-width: 380px; }
    h2 { font-size: 14px; margin: 0 0 8px; color: #aaa; }
    iframe { background: #fff; border: 1px solid #444; border-radius: 6px; }
    #pageFrame { width: 100%; height: 480px; }
    #popupFrame { width: 360px; height: 500px; }
    .btns { margin: 10px 0; display: flex; gap: 8px; }
    .btns button { padding: 8px 14px; border: none; border-radius: 6px; background: #1db954; color: #fff; cursor: pointer; font-size: 13px; }
    .btns button.secondary { background: #444; }
    #log { background: #111; border: 1px solid #333; border-radius: 6px; padding: 10px; font-size: 12px; line-height: 1.7; height: 320px; overflow-y: auto; white-space: pre-wrap; margin: 0; }
    .pass { color: #4caf50; }
    .fail { color: #f44336; }
  </style>
  <script src="mock-env.js"></script>
</head>
<body>
  <h1>MoeKoe-Music-SearchTips 调试台</h1>
  <div class="layout">
    <div class="left">
      <h2>模拟 MoeKoe Music 页面（直连 / 中继 / 主世界桥接三种模式自动切换）</h2>
      <iframe id="pageFrame" src="page-sim.html?role=page"></iframe>
    </div>
    <div class="right">
      <h2>插件 Popup（真实 popup.html + popup.js）</h2>
      <iframe id="popupFrame" src="popup-sim.html?role=popup"></iframe>
      <div class="btns">
        <button id="runBtn">▶ 运行完整测试（双模式）</button>
        <button id="clearBtn" class="secondary">🧹 清空日志</button>
      </div>
      <pre id="log"></pre>
    </div>
  </div>

  <script>
    const pageFrame = document.getElementById('pageFrame');
    const popupFrame = document.getElementById('popupFrame');
    const logEl = document.getElementById('log');
    let lines = [];
    let passCount = 0, failCount = 0;

    const STORAGE_KEY = 'search-suggest-config';
    const LEGACY_KEYS = ['search_maxResults', 'search_hotThreshold', 'search_enableHistory', 'search_autoSearch'];

    function log(msg, cls) {
      lines.push(msg);
      logEl.textContent = lines.join('\n');
      logEl.scrollTop = logEl.scrollHeight;
    }
    function assert(cond, name) {
      if (cond) { passCount++; log('  ✅ PASS: ' + name, 'pass'); }
      else { failCount++; log('  ❌ FAIL: ' + name, 'fail'); }
    }
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
    function kernel() { return window.__moekoeKernel; }
    function dumpChannelLogs() {
      const k = kernel();
      if (k && k.logs.length) k.logs.splice(0).forEach(m => log('      [通道] ' + m));
    }
    function kernelLogHas(substr) {
      const k = kernel();
      return k ? k.logs.some(m => String(m).indexOf(substr) !== -1) : false;
    }

    function reloadFrame(f) {
      return new Promise(res => {
        f.addEventListener('load', res, { once: true });
        try { f.contentWindow.location.reload(); } catch (e) { res(); }
      });
    }

    function setPageMode(mode) {
      const urls = {
        relay: 'page-sim.html?role=page&storage=off&kugouapi=off',
        bridge: 'page-sim.html?role=page&mwapi=1',
        direct: 'page-sim.html?role=page'
      };
      const url = urls[mode] || urls.direct;
      return new Promise(res => {
        pageFrame.addEventListener('load', res, { once: true });
        pageFrame.src = url;
      });
    }

    async function waitReady() {
      for (let i = 0; i < 80; i++) {
        const pd = pageFrame.contentDocument;
        const pod = popupFrame.contentDocument;
        const input = pd && pd.querySelector('input[type="text"]');
        const bound = input && input.hasAttribute('data-suggest-bound');
        const saveBtn = pod && pod.getElementById('saveBtn');
        if (bound && saveBtn) return true;
        await sleep(100);
      }
      return false;
    }

    async function doSearch(kw) {
      const win = pageFrame.contentWindow;
      const input = win.document.querySelector('input[type="text"]');
      input.value = kw;
      input.dispatchEvent(new win.Event('input', { bubbles: true }));
      await sleep(600);
    }
    function countItems() {
      const d = pageFrame.contentDocument;
      return d ? d.querySelectorAll('.moekoe-suggest-item').length : -1;
    }
    function setSlider(id, val) {
      const win = popupFrame.contentWindow;
      const el = popupFrame.contentDocument.getElementById(id);
      el.value = String(val);
      el.dispatchEvent(new win.Event('input', { bubbles: true }));
    }

    async function runSuite(mode) {
      log('');
      const MODE_LABELS = {
        direct: '直连模式（chrome.storage / kugouapi 可见，content 直接调用）',
        bridge: '主世界桥接模式（chrome.storage 可用、kugouapi 仅主世界可见，模拟真实 1.7.2 环境）',
        relay: '中继模式（chrome.storage / kugouapi 均不可见，模拟受限环境）'
      };
      log('===== 测试模式：' + (MODE_LABELS[mode] || mode) + ' =====');

      // 清空 storage 后以对应模式重载页面与 popup
      const k = kernel();
      try { pageFrame.contentWindow.localStorage.clear(); } catch (e) {}
      k.resetStorage();
      await setPageMode(mode);
      await reloadFrame(popupFrame);
      await waitReady();
      await sleep(400);
      if (!(await waitReady())) {
        log('❌ FAIL: 环境初始化超时', 'fail');
        return;
      }
      log('  ✅ 环境就绪');

      // Test A: 默认配置
      log('--- Test A: 默认配置应显示 10 条建议 ---');
      const countDisplay = popupFrame.contentDocument.getElementById('suggestCount').textContent;
      assert(countDisplay === '10', '[' + mode + '] popup 显示默认最大建议数为 10（实际 ' + countDisplay + '）');
      assert(!!kernel().storageData[STORAGE_KEY], '[' + mode + '] 首启后 chrome.storage 已持久化默认配置');
      await doSearch('默认配置');
      assert(countItems() === 10, '[' + mode + '] 默认配置搜索显示 10 条建议（实际 ' + countItems() + '）');

      // Test A2: 建议接口通道验证（直连 / 主世界桥接 / relay 代理）
      log('--- Test A2: 建议接口请求通道 ---');
      if (mode === 'relay') {
        assert(kernelLogHas('[kugouapi:relay]') && !kernelLogHas('[kugouapi:page]') && !kernelLogHas('[kugouapi:main]'),
          '[' + mode + '] 隔离世界经 relay 代理调用 kugouapi（无直连/桥接请求）');
      } else if (mode === 'bridge') {
        assert(kernelLogHas('[kugouapi:main]') && !kernelLogHas('[kugouapi:page]') && !kernelLogHas('[kugouapi:relay]'),
          '[' + mode + '] 隔离世界经主世界桥接调用 kugouapi（无直连/relay 请求）');
      } else {
        assert(kernelLogHas('[kugouapi:page]') && !kernelLogHas('[kugouapi:relay]') && !kernelLogHas('[kugouapi:main]'),
          '[' + mode + '] 页面主世界直接调用 kugouapi（无桥接/relay 请求）');
      }
      dumpChannelLogs();

      // Test B: 保存 maxResults=15，验证实时生效（无需刷新）
      log('--- Test B: 保存 maxResults=15，验证实时生效 ---');
      setSlider('maxResultsSlider', 15);
      popupFrame.contentDocument.getElementById('saveBtn').click();
      await sleep(400);
      assert(kernel().storageData[STORAGE_KEY] && kernel().storageData[STORAGE_KEY].maxResults === 15,
        '[' + mode + '] chrome.storage 中 search-suggest-config.maxResults = 15');
      assert(popupFrame.contentDocument.getElementById('suggestCount').textContent === '15',
        '[' + mode + '] popup UI 状态已更新为 15');
      await doSearch('保存后搜索');
      assert(countItems() === 15, '[' + mode + '] 保存后无需刷新，搜索即显示 15 条建议（实际 ' + countItems() + '）');
      dumpChannelLogs();

      // Test C: 热度阈值过滤
      log('--- Test C: 热度阈值 600 过滤 ---');
      setSlider('hotThresholdSlider', 600);
      popupFrame.contentDocument.getElementById('saveBtn').click();
      await sleep(400);
      await doSearch('阈值测试');
      assert(countItems() === 14, '[' + mode + '] 热度阈值 600 显示 14 条建议（实际 ' + countItems() + '）');
      dumpChannelLogs();

      // Test D: 点击建议自动搜索 + 搜索计数
      log('--- Test D: 点击建议自动搜索 + 计数 ---');
      const beforeCount = kernel().storageData.searchCount || 0;
      const firstName = pageFrame.contentDocument.querySelector('.moekoe-suggest-item .moekoe-suggest-name').textContent;
      pageFrame.contentDocument.querySelector('.moekoe-suggest-item').click();
      await sleep(300);
      const lastSearch = pageFrame.contentDocument.getElementById('lastSearch').textContent;
      assert(lastSearch === firstName, '[' + mode + '] 点击建议后自动搜索（@keydown.enter 收到 ' + lastSearch + '）');
      const panelEl = pageFrame.contentDocument.querySelector('.moekoe-search-suggest-panel');
      assert(panelEl && panelEl.style.display === 'none', '[' + mode + '] 点击建议后建议面板已隐藏');
      assert((kernel().storageData.searchCount || 0) === beforeCount,
        '[' + mode + '] 点击建议（自动填充）不额外计数（保持 ' + beforeCount + '，实际 ' + (kernel().storageData.searchCount || 0) + '）');
      assert(!!kernel().storageData.searchCountDate, '[' + mode + '] 搜索计数日期已记录');
      dumpChannelLogs();

      // Test E: 再次搜索计数递增 + popup 实时显示
      log('--- Test E: 搜索计数递增与 popup 实时显示 ---');
      await doSearch('计数测试');
      assert((kernel().storageData.searchCount || 0) === beforeCount + 1,
        '[' + mode + '] 再次搜索后计数 +1（期望 ' + (beforeCount + 1) + '，实际 ' + (kernel().storageData.searchCount || 0) + '）');
      const countText = popupFrame.contentDocument.getElementById('searchCountDisplay').textContent;
      assert(countText.indexOf(String(beforeCount + 1)) !== -1,
        '[' + mode + '] popup 状态页实时显示计数（' + countText.trim() + '）');
      dumpChannelLogs();

      // Test F: 旧版多键配置迁移
      log('--- Test F: 旧版多键配置自动迁移 ---');
      kernel().storageRemove([STORAGE_KEY]);
      kernel().storageSet({
        search_maxResults: 17,
        search_hotThreshold: 100,
        search_enableHistory: true,
        search_autoSearch: true
      });
      await reloadFrame(pageFrame);
      await waitReady();
      await sleep(400);
      const migrated = kernel().storageData[STORAGE_KEY];
      assert(!!migrated && migrated.maxResults === 17, '[' + mode + '] 旧版多键已迁移为 search-suggest-config.maxResults=17');
      const legacyGone = LEGACY_KEYS.every(k => !(k in kernel().storageData));
      assert(legacyGone, '[' + mode + '] 迁移后旧版多键已清除');
      await doSearch('迁移测试');
      assert(countItems() === 17, '[' + mode + '] 迁移配置生效，显示 17 条建议（实际 ' + countItems() + '）');
      dumpChannelLogs();

      // Test G: 重启保留（重载页面 iframe 模拟重启）
      log('--- Test G: 重启后配置保留 ---');
      await reloadFrame(pageFrame);
      await waitReady();
      await sleep(400);
      await doSearch('重启保留测试');
      assert(countItems() === 17, '[' + mode + '] 重启后仍显示 17 条建议（实际 ' + countItems() + '）');
      dumpChannelLogs();
    }

    async function runTests() {
      passCount = 0; failCount = 0; lines = [];
      log('===== 测试开始 =====');
      await runSuite('direct');
      await runSuite('relay');
      await runSuite('bridge');
      log('');
      log('===== 测试结束：' + passCount + ' 通过, ' + failCount + ' 失败 =====');
      document.title = 'TESTS-' + passCount + 'PASS-' + failCount + 'FAIL';
    }

    document.getElementById('runBtn').addEventListener('click', () => { runTests(); });
    document.getElementById('clearBtn').addEventListener('click', () => { lines = []; logEl.textContent = ''; });

    if (location.search.indexOf('auto=1') !== -1) {
      window.addEventListener('load', () => setTimeout(runTests, 300));
    }
  </script>
</body>
</html>
