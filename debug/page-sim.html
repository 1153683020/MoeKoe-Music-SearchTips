<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>模拟 MoeKoe Music</title>
  <style>
    body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; padding: 20px; background: #f5f5f5; }
    h3 { margin: 0 0 12px; color: #1db954; }
    .search-bar { position: relative; margin-bottom: 16px; }
    .search-bar input { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
    .hint { color: #999; font-size: 12px; }
  </style>
  <script src="mock-env.js"></script>
  <!-- 搜索建议数据由 mock-env.js 模拟的 kugouapi 提供（MoeKoe 1.7.2+，不再拦截 6521 fetch） -->
  <script src="../main-world.js"></script>
  <script>
    // ?mwapi=1：main-world.js（主世界脚本）已在加载时捕获 kugouapi 引用，
    // 此处从共享 window 移除，模拟"主世界可见、隔离世界不可见"的真实双世界形态
    (function() {
      if (/[?&]mwapi=1/.test(location.search) && window.kugouapi) {
        try { delete window.kugouapi; } catch (e) { window.kugouapi = undefined; }
        var k = window.top.__moekoeKernel;
        if (k && k.log) k.log('[page] kugouapi 已从共享 window 移除（模拟隔离世界，主世界脚本持引用）');
      }
    })();
  </script>
</head>
<body>
  <h3>🎵 模拟 MoeKoe Music 页面</h3>
  <div class="search-bar">
    <input type="text" placeholder="搜索音乐..." id="mockSearchInput">
  </div>
  <p class="hint">在上方搜索框输入即可看到搜索建议（由 content.js 注入）</p>
  <p class="hint">最后模拟搜索（@keydown.enter 触发）：<span id="lastSearch">（无）</span></p>
  <script>
    // 模拟萌音 Header.vue 的 @keydown.enter="getSearch"：记录 Enter 触发时的关键词
    (function() {
      var input = document.getElementById('mockSearchInput');
      input.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          document.getElementById('lastSearch').textContent = this.value || '（空）';
        }
      });
    })();
  </script>
  <script src="../content.js"></script>
</body>
</html>
